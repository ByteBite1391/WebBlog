{% extends "base.html" %}
{% block title %}حذف مقاله — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="delete-page">
    <div class="delete-card">
        <div class="delete-icon"><svg class="icon"><use href="#i-trash"/></svg></div>
        <h1>حذف مقاله</h1>
        <p>آیا از حذف این مقاله مطمئن هستید؟</p>
        <div class="delete-blog-name">{{ post.title }}</div>
        <form method="post">
            {% csrf_token %}
            <div class="delete-actions">
                <a href="{% url 'blog:dashboard' %}" class="secondary-btn">انصراف</a>
                <button type="submit" class="danger-btn">حذف قطعی</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
